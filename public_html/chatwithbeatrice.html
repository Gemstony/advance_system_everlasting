<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everlasting Academy - Chat with Beatrice</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">

  <style>
    /* Chat Button */
    #chatBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      border-radius: 50px;
      padding: 12px 20px;
    }

    /* Chat Modal */
    #chatModal .modal-dialog {
      max-width: 350px;
      position: fixed;
      bottom: 80px;
      right: 20px;
      margin: 0;
    }

    #chatModal .modal-content {
      border-radius: 15px;
      overflow: hidden;
    }

    .chat-message {
      margin: 10px 0;
      display: flex;
      align-items: flex-start;
    }

    .chat-user {
      justify-content: flex-end;
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 15px;
      max-width: 80%;
      display: inline-block;
      position: relative;
    }

    .user-bubble {
      background: #0d6efd;
      color: white;
    }

    .bot-bubble {
      background: #e2e3e5;
      color: #000;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }

    /* Animated dots for typing */
    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      background: #555;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <!-- Header / Navbar (can use your full navigation here) -->
  <header class="header fixed-top">
    <div class="topbar d-flex align-items-center dark-background">
      <div class="container d-flex justify-content-center justify-content-md-between">
        <div class="contact-info d-flex align-items-center">
          <i class="bi bi-envelope d-flex align-items-center"><a
              href="mailto:everlastingacademy24@gmail.com">everlastingacademy24@gmail.com</a></i>
          <i class="bi bi-phone d-flex align-items-center ms-4"><span>+255 745 333 311 | 255 719 629 304</span></i>
        </div>
        <div class="social-links d-none d-md-flex align-items-center"><a href="https://www.facebook.com/share/p/1BFGU5zh4M/" class="facebook"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/everlasting_academy2024/" class="instagram"><i class="bi bi-instagram"></i></a>
          <a href="https://youtube.com/shorts/qftJ_Pb076Q?si=QqLZbwj1N-vvxyVX" class="youtube"><i class="bi bi-youtube"></i></a>
        
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="main" style="padding-top:100px;">
    <div class="container text-center">
      <h1>Welcome to Everlasting Academy</h1>
      <p>Chat with Beatrice if you have any questions!</p>
    </div>
  </main>

  <!-- Chat Button -->
  <button id="chatBtn" class="btn btn-primary"><i class="bi bi-chat-dots"></i> Chat with Beatrice</button>

  <!-- Chat Modal -->
  <div class="modal fade" id="chatModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Beatrice</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-3" id="chatBody" style="height:300px; overflow-y:auto; background:#f4f4f4;">
          <!-- Chat messages appear here -->
        </div>
        <div class="modal-footer p-2">
          <input type="text" id="userInput" class="form-control" placeholder="Type a message..." />
          <button id="sendBtn" class="btn btn-primary ms-2">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer (you can keep your full footer here) -->
  <footer class="footer-16 footer position-relative">
    <div class="container">
      <div class="footer-main">
        <div class="row align-items-start">
          <div class="col-lg-5">
            <div class="brand-section">
              <a href="index.html" class="logo d-flex align-items-center mb-4">
                <span class="sitename">Everlasting Academy</span>
              </a>
              <p class="brand-description">A home to every learner</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    const chatBtn = document.getElementById('chatBtn');
    const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatBody = document.getElementById('chatBody');

    // Open chat modal
    chatBtn.addEventListener('click', () => chatModal.show());

    // Load chat from localStorage
    function loadChat() {
      const chatHistory = JSON.parse(localStorage.getItem('chatHistory') || '[]');
      chatBody.innerHTML = '';
      chatHistory.forEach(msg => appendMessage(msg.text, msg.sender, false));
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Save chat
    function saveMessage(message, sender) {
      const chatHistory = JSON.parse(localStorage.getItem('chatHistory') || '[]');
      chatHistory.push({ text: message, sender: sender });
      localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }

    // Append message
    function appendMessage(message, sender = 'user', save = true) {
      const div = document.createElement('div');
      div.classList.add('chat-message');
      if (sender === 'user') div.classList.add('chat-user');

      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble', sender === 'user' ? 'user-bubble' : 'bot-bubble');
      bubble.innerHTML = message;
      div.appendChild(bubble);
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
      if (save) saveMessage(message, sender);
    }

    // Animated typing dots
    function showTyping() {
      const div = document.createElement('div');
      div.classList.add('chat-message');
      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble', 'bot-bubble', 'typing');
      bubble.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span> Beatrice is typing...`;
      div.appendChild(bubble);
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
      return div;
    }

    // Keyword-based bot responses
    function getBotResponse(message) {
      message = message.toLowerCase();
      if (message.includes('hello') || message.includes('hi')) return 'Hello! 👋 How can I assist you today?';
      if (message.includes('admission')) return 'You can apply through our Admission & Enrollment system. Would you like the link?';
      if (message.includes('courses') || message.includes('program')) return 'We offer Science, Humanities, Commerce, and Enrichment programs.';
      if (message.includes('contact')) return 'You can reach us at everlastingacademy24@gmail.com or call +255 719 629 304.';
      if (message.includes('thanks') || message.includes('thank')) return 'You’re welcome! 😊';
      return 'I am here to help! Can you please clarify your question?';
    }

    // Speak the bot reply
    function speak(text) {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(msg);
      }
    }

    // Bot reply simulation
    function botReply(userMessage) {
      const typingDiv = showTyping();
      const delay = Math.min(1500 + userMessage.length * 50, 4000);

      setTimeout(() => {
        typingDiv.remove();
        const botMessage = getBotResponse(userMessage);
        appendMessage(botMessage, 'bot');
        speak(botMessage);
      }, delay);
    }

    // Handle sending
    function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;
      appendMessage(message, 'user');
      userInput.value = '';
      botReply(message);
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    loadChat();
  </script>
</body>

</html>
